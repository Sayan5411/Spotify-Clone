<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Your favorite music is here</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <ul>
        <li class="brand">
            <img src="logo.png" alt="Spotify"> Spotify
        </li>
        <li>Home</li>
        <li>About</li>
    </ul>
</nav>

<div class="container">
    <div class="songList">
        <div class="songListHeader">
            <img src="cover2.png" alt="Best of Fakira cover" class="titleCover">
            <h1>Best of Fakira</h1>
        </div>

        <div class="songItemContainer">

            <div class="songItem">
                <img src="cover.png" alt="1">
                <span class="songName">Prithibita Naki</span>
                <span class="timestamp">
                    05:34 
                    <i id="0" class="fa-solid songItemPlay fa-play-circle"></i>
                </span>
            </div>

            <div class="songItem">
                <img src="cover.png" alt="2">
                <span class="songName">Bhromor</span>
                <span class="timestamp">
                    05:34 
                    <i id="1" class="fa-solid songItemPlay fa-play-circle"></i>
                </span>
            </div>

            <div class="songItem">
                <img src="cover.png" alt="3">
                <span class="songName">Hare Krishna</span>
                <span class="timestamp">
                    05:34 
                    <i id="2" class="fa-solid songItemPlay fa-play-circle"></i>
                </span>
            </div>

            <div class="songItem">
                <img src="cover.png" alt="4">
                <span class="songName">Anandabazar</span>
                <span class="timestamp">
                    05:34 
                    <i id="3" class="fa-solid songItemPlay fa-play-circle"></i>
                </span>
            </div>

            <div class="headlineTicker" id="headlineTicker">
                <div class="headlineTickerTrack" id="headlineTickerTrack"></div>
            </div>

        </div>
    </div>
</div>

<div class="bottom">
    <input type="range" id="myProgressBar" min="0" max="100" value="0">
    <div class="playTopSlider" id="playTopSlider">
        <div class="playTopSliderTrack"></div>
    </div>

    <div class="icons">
        <i class="fa-solid fa-step-backward" id="previous"></i>
        <i class="fa-solid fa-play-circle" id="masterPlay"></i>
        <i class="fa-solid fa-step-forward" id="next"></i>
    </div>

    <div class="songInfo">
        <img src="playing.gif" width="42" alt="" id="gif"> 
        <span id="currentSong">Joy Rock</span>
    </div>
</div>

<script src="https://kit.fontawesome.com/05799b789c.js" crossorigin="anonymous"></script>
<script src="script.js"></script>

</body>
</html>
